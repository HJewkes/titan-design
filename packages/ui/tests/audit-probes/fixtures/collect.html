<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        font-family: sans-serif;
      }
      .pair {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .numeral {
        font-size: 48px;
        line-height: 1;
      }
      .wrapper {
        padding: 12px;
      }
      .ragged {
        width: 200px;
        font-size: 14px;
        line-height: 20px;
      }
      .shadowed {
        padding: 12px;
        box-shadow: 0 1px 4px rgb(0, 0, 0);
      }
      .scaled {
        transform: scale(2);
        transform-origin: 0 0;
        height: 40px;
      }
      .swatch {
        width: 40px;
        height: 20px;
        background: rgb(80, 120, 200);
      }
    </style>
  </head>
  <body>
    <div id="storybook-root">
      <div class="pair" data-testid="pair">
        <span data-testid="pair-small" style="font-size: 12px">Label</span>
        <span data-testid="pair-large" style="font-size: 32px">128</span>
      </div>
      <div class="numeral" data-testid="numeral">8</div>
      <svg width="120" height="40" data-testid="chart">
        <text x="4" y="30" font-size="16">Axis</text>
      </svg>
      <div class="wrapper" data-testid="wrapper">
        <div class="swatch" data-testid="swatch"></div>
      </div>
      <div class="ragged" data-testid="ragged">ab<br />a much longer middle<br />cd</div>
      <div class="shadowed" data-testid="shadowed"><div class="swatch"></div></div>
      <div style="font-size: 14px" data-testid="unscaled">Ag</div>
      <div class="scaled"><div style="font-size: 14px" data-testid="scaled">Ag</div></div>
      <svg width="240" height="80" viewBox="0 0 120 40" data-testid="zoomed">
        <text x="4" y="30" font-size="16">Axis</text>
      </svg>
      <svg width="120" height="40" data-testid="mixed">
        <text x="4" y="30" font-size="10">
          a
          <tspan font-size="24">B</tspan>
        </text>
      </svg>
      <svg width="120" height="40" data-testid="big">
        <text x="4" y="30" font-size="24">B</text>
      </svg>
      <div style="height: 1px; background: rgb(128, 128, 128)" data-testid="hairline"></div>
      <div style="opacity: 0"><span data-testid="faded">Hidden</span></div>
      <div style="background: rgb(200, 40, 40)">
        <div style="background: rgba(0, 0, 255, 0.4); padding: 4px">
          <span data-testid="over-rgba" style="color: rgb(250, 250, 250)">Layered</span>
        </div>
      </div>
      <div style="background-image: linear-gradient(rgb(0, 0, 0), rgb(40, 40, 40))">
        <span data-testid="over-image">On an image</span>
      </div>
      <div style="opacity: 0.5">
        <div style="opacity: 0.5"><span data-testid="half-of-half">Quarter</span></div>
      </div>
      <span
        data-testid="tracked"
        style="
          letter-spacing: 1.2px;
          text-transform: uppercase;
          font-weight: 600;
          font-family: 'Sample Face', sans-serif;
          text-align: right;
          display: block;
          direction: rtl;
          box-shadow: rgb(0, 0, 0) 0px 0px 0px 1px;
        "
        >Overline text that runs well past the forty characters kept</span
      >
      <span data-testid="untracked">Plain</span>
      <div class="icons" style="color: rgb(10, 120, 60)">
        <svg
          data-testid="icon-a"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
        >
          <path d="M5 12h14" />
          <circle cx="12" cy="12" r="10" />
        </svg>
        <svg
          data-testid="icon-b"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
        >
          <path d="M5 12h14" />
          <circle cx="12" cy="12" r="10" />
        </svg>
        <svg data-testid="icon-c" width="24" height="24" viewBox="0 0 24 24" fill="rgb(1, 2, 3)">
          <path d="M12 5v14" />
        </svg>
        <svg
          data-testid="icon-named"
          data-icon="sample-icon"
          width="24"
          height="24"
          viewBox="0 0 24 24"
        >
          <rect x="2" y="2" width="20" height="20" />
        </svg>
      </div>
      <div role="heading" aria-level="3" data-testid="aria-heading">Section</div>
      <h4 data-testid="tag-heading">Subsection</h4>
      <div role="heading" data-testid="default-heading">Untitled level</div>
      <div data-concept="sample-concept" data-testid="concept">Concept chip</div>
      <div role="tab" aria-selected="true" aria-current="page" data-testid="selected">Tab</div>
      <div aria-disabled="true">
        <button aria-pressed="true" data-testid="disabled-child">Toggle</button>
      </div>
    </div>
  </body>
</html>
