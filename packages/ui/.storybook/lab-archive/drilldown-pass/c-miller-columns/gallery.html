<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1.0">
<title>Direction C — Master/Detail Columns · Voltras drill-down</title>
<style>
  :root{
    --bg:#0c0d0f; --stage:#0f1012; --surface:#17181c; --raised:#1e2025; --spine:#131418;
    --border:#24262d; --border-strong:#31343d; --hover:rgba(255,255,255,.04);
    --text:#E8EAED; --muted:#8D95A3; --dim:#5b616d;
    --brand:#FF7900; --brand-soft:rgba(255,121,0,.14); --steel:#406D87;
    --teal:#14B8A6; --red:#D14343; --amber:#FFB020; --sky:#2196F3;
    --v-green:#2ed573; --v-yellow:#ffd43b; --v-orange:#ffa502; --v-red:#ff4757;
    --heat-under:#4A90D9; --heat-maint:#F5C842; --heat-prod:#4CAF50; --heat-appr:#FFA502; --heat-over:#FF6B35;
    --ease:cubic-bezier(.22,1,.36,1);
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{background:#000;color:var(--text);font-family:var(--sans)}
  body{display:flex;justify-content:center;padding:16px;-webkit-font-smoothing:antialiased}
  .caption{position:fixed;top:6px;left:12px;font-size:10px;color:#3a3d44;font-family:var(--mono);letter-spacing:.4px}

  .device{width:1280px;height:800px;background:var(--bg);border:1px solid var(--border);border-radius:14px;
    overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 80px rgba(0,0,0,.6)}

  /* ---- topbar ---- */
  .topbar{height:46px;flex:0 0 46px;display:flex;align-items:center;gap:14px;padding:0 14px;
    background:linear-gradient(180deg,#141519,#101113);border-bottom:1px solid var(--border)}
  .brand{font-weight:800;letter-spacing:1.5px;font-size:12px;color:var(--text);display:flex;align-items:center;gap:7px;white-space:nowrap}
  .brand .mk{color:var(--brand)}
  .brand .dim{font-weight:600;letter-spacing:.4px;color:var(--dim);font-size:10px}
  .chips{display:flex;gap:5px;flex:1;overflow:hidden}
  .chip{font-size:11px;font-weight:700;color:var(--muted);background:transparent;border:1px solid var(--border-strong);
    padding:5px 11px;border-radius:20px;cursor:pointer;white-space:nowrap;transition:all .2s;letter-spacing:.2px}
  .chip:hover{color:var(--text);border-color:#454954}
  .chip.on{color:#111;background:var(--brand);border-color:var(--brand)}
  .topstatus{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
  .pulse{width:8px;height:8px;border-radius:50%;background:var(--v-green);box-shadow:0 0 0 0 rgba(46,213,115,.6);animation:pulse 1.6s infinite}
  .pulse.off{background:var(--dim);animation:none;box-shadow:none}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(46,213,115,.55)}70%{box-shadow:0 0 0 7px rgba(46,213,115,0)}100%{box-shadow:0 0 0 0 rgba(46,213,115,0)}}

  /* ---- body ---- */
  .body{flex:1;display:flex;min-height:0}
  .rail{width:60px;flex:0 0 60px;background:#0a0b0d;border-right:1px solid var(--border);
    display:flex;flex-direction:column;align-items:center;padding-top:10px;gap:4px}
  .railbtn{width:46px;height:46px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;cursor:pointer;color:var(--dim);transition:all .2s;font-size:8px;font-weight:700;letter-spacing:.3px}
  .railbtn:hover{background:var(--hover);color:var(--muted)}
  .railbtn.on{background:var(--brand-soft);color:var(--brand)}
  .railbtn svg{width:20px;height:20px}
  .railspacer{flex:1}

  .stage{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--stage)}
  .crumb{height:36px;flex:0 0 36px;display:flex;align-items:center;gap:6px;padding:0 16px;border-bottom:1px solid var(--border);
    font-size:11px;color:var(--muted);overflow:hidden}
  .crumb .c{cursor:pointer;transition:color .15s;white-space:nowrap;font-weight:600}
  .crumb .c:hover{color:var(--text)}
  .crumb .c.cur{color:var(--text);cursor:default}
  .crumb .sep{color:var(--dim);font-size:10px}
  .crumb .tag{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.5px;text-transform:uppercase}

  .stagebody{flex:1;min-height:0;position:relative;overflow:hidden}

  /* ---- columns ---- */
  .cols{display:flex;height:100%;overflow:hidden}
  .col{position:relative;height:100%;flex:0 0 auto;overflow:hidden;background:var(--stage);
    border-right:1px solid var(--border);
    transition:width .42s var(--ease),flex-basis .42s var(--ease),transform .4s var(--ease),opacity .3s var(--ease)}
  .col.full{width:238px}
  .col.wide{width:290px}
  .col.spine{width:86px;background:var(--spine)}
  .col.focus{flex:1 1 auto;min-width:372px;width:auto;background:linear-gradient(180deg,#101215,#0d0e11)}
  .col.spawning{transform:translateX(60px);opacity:0}
  .col.leaving{transform:translateX(70px);opacity:0;width:0!important;min-width:0!important;flex:0 0 0!important;border:none}
  .colinner{height:100%;overflow-y:auto;overflow-x:hidden}
  .colinner::-webkit-scrollbar{width:6px}
  .colinner::-webkit-scrollbar-thumb{background:#2a2d34;border-radius:3px}

  .colhead{padding:12px 14px 9px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--stage);z-index:2}
  .col.focus .colhead{background:#0f1114}
  .colhead .lvl{font-size:9px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim)}
  .colhead .ttl{font-size:15px;font-weight:800;margin-top:2px;letter-spacing:-.2px}
  .colhead .sub{font-size:11px;color:var(--muted);margin-top:2px;font-family:var(--mono)}

  /* spine (compressed ancestor) */
  .spineinner{height:100%;display:flex;flex-direction:column;padding:10px 0;cursor:pointer}
  .spinelabel{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;font-weight:800;letter-spacing:2px;
    text-transform:uppercase;color:var(--dim);margin:6px auto 8px;white-space:nowrap}
  .spinesel{font-size:10px;font-weight:800;color:var(--brand);text-align:center;padding:0 6px;line-height:1.15;margin-bottom:8px}
  .spinedots{display:flex;flex-direction:column;gap:5px;align-items:center;padding:0 8px;flex:1}
  .spinedot{width:100%;height:7px;border-radius:3px;background:#22252c;transition:background .2s;position:relative}
  .spinedot:hover{background:#31343d}
  .spinedot.on{background:var(--brand)}
  .spinehint{font-size:8px;color:var(--dim);text-align:center;margin-top:6px;letter-spacing:.4px}

  /* list rows / cards */
  .exrow{padding:11px 13px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
  .exrow:hover{background:var(--hover)}
  .exrow.sel{background:var(--brand-soft);box-shadow:inset 3px 0 0 var(--brand)}
  .exrow .r1{display:flex;align-items:center;gap:7px}
  .exname{font-size:13px;font-weight:800;letter-spacing:-.2px}
  .e1rm{margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--brand);white-space:nowrap;
    background:var(--brand-soft);padding:2px 6px;border-radius:5px}
  .e1rm.na{color:var(--dim);background:#1a1c20}
  .star{color:var(--v-yellow);font-size:10px}
  .exmeta{font-size:11px;color:var(--muted);margin-top:3px;font-family:var(--mono)}
  .ministrips{display:flex;gap:3px;margin-top:7px}
  .ministrip{flex:1;height:16px;display:flex;align-items:flex-end;gap:1px}
  .ministrip.ph{border:1px dashed #3a3d44;border-radius:2px;opacity:.5}
  .msbar{flex:1;border-radius:1px;min-height:2px}
  .exan{font-size:9px;color:var(--dim);margin-top:7px;letter-spacing:.4px;display:inline-flex;align-items:center;gap:4px;
    border:1px solid var(--border-strong);border-radius:5px;padding:2px 6px;cursor:pointer;transition:all .15s}
  .exan:hover{color:var(--sky);border-color:var(--sky)}

  /* set rows (L2) */
  .setrow{display:flex;align-items:center;padding:10px 13px;border-bottom:1px solid var(--border);cursor:pointer;gap:9px;transition:background .15s}
  .setrow:hover{background:var(--hover)}
  .setrow.sel{background:var(--brand-soft);box-shadow:inset 3px 0 0 var(--brand)}
  .setrow.live{box-shadow:inset 3px 0 0 var(--v-green);background:rgba(46,213,115,.06)}
  .setno{width:26px;height:26px;border-radius:7px;background:#20232a;display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:12px;font-weight:700;color:var(--muted);flex:0 0 auto}
  .setrow.sel .setno{background:var(--brand);color:#111}
  .setmid{flex:1;min-width:0}
  .setrxw{font-size:12px;font-weight:700}
  .setsub{font-size:10px;color:var(--muted);font-family:var(--mono);margin-top:1px}
  .setnum{text-align:right;flex:0 0 auto}
  .setmean{font-family:var(--mono);font-size:14px;font-weight:800}
  .setloss{font-family:var(--mono);font-size:10px;margin-top:1px}
  .warn{color:var(--amber)} .bad{color:var(--v-red)} .ok{color:var(--muted)}
  .pr{font-size:8px;font-weight:800;color:var(--v-yellow);background:rgba(255,212,59,.12);padding:1px 4px;border-radius:3px;letter-spacing:.4px}
  .rpepill{font-family:var(--mono);font-size:10px;color:var(--brand);flex:0 0 auto}

  /* set detail (L3, focus) */
  .pad{padding:14px 16px}
  .bignum{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .bignum .v{font-family:var(--mono);font-size:40px;font-weight:800;letter-spacing:-1px;line-height:1}
  .bignum .u{font-size:13px;color:var(--muted);font-weight:700}
  .bignum .k{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;font-weight:800;margin-bottom:2px}
  .kv{display:flex;flex-direction:column;gap:2px}
  .kv .vv{font-family:var(--mono);font-size:16px;font-weight:800}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:13px;margin:12px 16px}
  .panel.tight{padding:11px 13px}
  .ptitle{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .ptitle .t{font-size:11px;font-weight:800;letter-spacing:.4px;color:var(--text)}
  .ptitle .m{font-family:var(--mono);font-size:10px;color:var(--muted)}

  /* velocity bars */
  .vbars{position:relative;display:flex;align-items:flex-end;gap:4px;height:118px;padding:16px 4px 4px;
    border-bottom:1px solid var(--border-strong)}
  .vbar{flex:1;border-radius:3px 3px 0 0;min-height:3px;position:relative;cursor:pointer;transition:filter .15s,transform .15s;
    transform-origin:bottom}
  .vbar:hover{filter:brightness(1.25)}
  .vbar.sel{outline:2px solid #fff;outline-offset:1px}
  .vbar.pop{animation:pop .4s var(--ease)}
  @keyframes pop{0%{transform:scaleY(.55)}60%{transform:scaleY(1.07)}100%{transform:scaleY(1)}}
  .vbar .lab{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:9px;
    font-weight:700;color:var(--muted);white-space:nowrap}
  .refline{position:absolute;left:0;right:0;border-top:1px dashed;pointer-events:none;display:flex;align-items:center}
  .refline .rl{font-family:var(--mono);font-size:8px;padding:0 3px;letter-spacing:.3px;position:absolute;right:2px;top:-9px;background:var(--surface)}
  .qlane{display:flex;gap:4px;padding:7px 4px 2px}
  .qdot{flex:1;height:6px;border-radius:3px}
  .qlabels{display:flex;gap:4px;padding:2px 4px}
  .qlabels div{flex:1;text-align:center;font-family:var(--mono);font-size:8px;color:var(--dim)}

  /* tempo bar */
  .tempo{display:flex;height:26px;border-radius:6px;overflow:hidden;gap:2px}
  .tseg{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:9px;font-weight:800;
    color:#0c0d0f;position:relative;overflow:hidden}
  .tseg .fill{position:absolute;inset:0;background:rgba(255,255,255,.22)}
  .tlabels{display:flex;margin-top:4px;font-family:var(--mono);font-size:9px;color:var(--muted)}
  .tlabels div{text-align:center}

  /* fatigue meter */
  .fmeter{position:relative;height:14px;border-radius:7px;overflow:hidden;
    background:linear-gradient(90deg,var(--v-green) 0%,var(--v-green) 25%,var(--v-yellow) 25%,var(--v-yellow) 50%,var(--v-orange) 50%,var(--v-orange) 75%,var(--v-red) 75%)}
  .fneedle{position:absolute;top:-3px;width:4px;height:20px;background:#fff;border-radius:2px;box-shadow:0 0 5px rgba(255,255,255,.6);
    transition:left .5s var(--ease)}
  .fscale{display:flex;justify-content:space-between;margin-top:4px;font-family:var(--mono);font-size:8px;color:var(--dim)}

  /* rpe gauge */
  .rpeg{position:relative;height:30px}
  .rpetrack{position:absolute;top:12px;left:0;right:0;height:5px;border-radius:3px;background:#22252c}
  .rpeband{position:absolute;top:10px;height:9px;border-radius:5px;background:rgba(33,150,243,.32);border:1px solid rgba(33,150,243,.5)}
  .rpeact{position:absolute;top:5px;width:3px;height:19px;background:var(--brand);border-radius:2px}
  .rpescale{display:flex;justify-content:space-between;position:absolute;bottom:-2px;left:0;right:0;font-family:var(--mono);font-size:8px;color:var(--dim)}

  /* rep detail (L4) */
  .repbig{text-align:center;padding:20px 0 8px}
  .repbig .v{font-family:var(--mono);font-size:56px;font-weight:800;letter-spacing:-2px;line-height:1}
  .repbig .u{font-size:14px;color:var(--muted);font-weight:700}
  .repgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
  .rcell{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px}
  .rcell .k{font-size:9px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim);font-weight:800}
  .rcell .v{font-family:var(--mono);font-size:19px;font-weight:800;margin-top:3px}
  .rcell .s{font-size:10px;color:var(--muted);margin-top:1px}

  /* analytics column */
  .trend{width:100%;height:132px}
  .lvchart{width:100%;height:150px}
  .progtbl{width:100%;border-collapse:collapse;font-size:11px}
  .progtbl th{text-align:left;font-size:9px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);padding:6px 8px;font-weight:800}
  .progtbl td{padding:7px 8px;border-top:1px solid var(--border);font-family:var(--mono)}
  .mesostat{display:flex;align-items:center;gap:12px}
  .ring{position:relative;width:54px;height:54px;flex:0 0 auto}
  .nexttarget{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:10px;
    background:var(--brand-soft);border-radius:8px;padding:8px 10px}
  .nexttarget b{color:var(--text)}

  /* ---- live hero ---- */
  .hero{height:100%;display:flex;flex-direction:column;padding:20px 26px;transition:background .5s}
  .hero.flood-amber{background:radial-gradient(120% 90% at 50% 0%,rgba(255,176,32,.13),transparent 60%)}
  .hero.flood-red{background:radial-gradient(120% 90% at 50% 0%,rgba(255,71,87,.16),transparent 60%);animation:redpulse 1.3s infinite}
  @keyframes redpulse{0%,100%{background:radial-gradient(120% 90% at 50% 0%,rgba(255,71,87,.10),transparent 60%)}50%{background:radial-gradient(120% 90% at 50% 0%,rgba(255,71,87,.22),transparent 60%)}}
  .herohead{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px}
  .herocat{font-size:13px;font-weight:800;letter-spacing:.4px;color:var(--teal);text-transform:uppercase}
  .hero.flood-amber .herocat{color:var(--amber)} .hero.flood-red .herocat{color:var(--v-red)}
  .heroname{font-size:30px;font-weight:800;letter-spacing:-.5px;margin-top:1px}
  .herodetail{text-align:right;font-family:var(--mono);font-size:13px;color:var(--muted);line-height:1.5}
  .herodetail b{color:var(--text);font-size:15px}
  .heromid{flex:1;display:flex;gap:26px;min-height:0;margin-top:6px}
  .heroleft{flex:1.5;display:flex;flex-direction:column;min-width:0}
  .heroright{flex:1;display:flex;flex-direction:column;gap:14px;min-width:0}
  .herobars{flex:1;display:flex;align-items:flex-end;gap:8px;padding:26px 6px 6px;position:relative;
    border-bottom:2px solid var(--border-strong)}
  .herobar{flex:1;max-width:64px;border-radius:5px 5px 0 0;min-height:4px;position:relative;transform-origin:bottom}
  .herobar .lab{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:12px;font-weight:800;color:var(--text)}
  .herobar.pop{animation:pop .42s var(--ease)}
  .heropeak{text-align:center}
  .heropeak .v{font-family:var(--mono);font-size:86px;font-weight:800;letter-spacing:-3px;line-height:.9;transition:color .3s}
  .heropeak .v.bounce{animation:bounce .4s var(--ease)}
  @keyframes bounce{0%{transform:scale(.9)}55%{transform:scale(1.06)}100%{transform:scale(1)}}
  .heropeak .u{font-size:18px;color:var(--muted);font-weight:700}
  .herostats{display:flex;gap:22px;justify-content:center;margin-top:4px}
  .hs{text-align:center} .hs .k{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);font-weight:800}
  .hs .v{font-family:var(--mono);font-size:26px;font-weight:800;margin-top:2px}
  .herocue{border-radius:11px;padding:12px 14px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:10px;
    opacity:0;transform:translateY(6px);transition:all .35s;min-height:0}
  .herocue.show{opacity:1;transform:none}
  .herocue.amber{background:rgba(255,176,32,.14);border:1px solid rgba(255,176,32,.4);color:var(--amber)}
  .herocue.red{background:rgba(255,71,87,.16);border:1px solid rgba(255,71,87,.45);color:var(--v-red)}
  .herolabel{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin-bottom:7px}
  .setprog{display:flex;gap:5px}
  .setprog .s{flex:1;height:6px;border-radius:3px;background:#22252c}
  .setprog .s.done{background:var(--teal)} .setprog .s.cur{background:var(--brand)}

  /* rest hero */
  .restwrap{height:100%;display:flex;padding:26px 30px;gap:28px}
  .restleft{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
  .restring{position:relative;width:220px;height:220px}
  .restring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .restring .num .t{font-family:var(--mono);font-size:58px;font-weight:800;letter-spacing:-2px}
  .restring .num .k{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);font-weight:800}
  .restright{flex:1.1;display:flex;flex-direction:column;gap:14px;justify-content:center}
  .verdict{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:16px}
  .verdict .cat{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--teal)}
  .verdict .line{font-size:15px;font-weight:700;margin-top:5px;line-height:1.35}
  .verdict .sub{font-size:12px;color:var(--muted);margin-top:5px}
  .summrow{display:flex;gap:10px;margin-top:12px}
  .summcell{flex:1;text-align:center;background:var(--raised);border-radius:9px;padding:9px 4px}
  .summcell .k{font-size:9px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);font-weight:800}
  .summcell .v{font-family:var(--mono);font-size:17px;font-weight:800;margin-top:2px}
  .nextset{background:linear-gradient(135deg,rgba(255,121,0,.14),rgba(64,109,135,.1));
    border:1px solid rgba(255,121,0,.3);border-radius:13px;padding:15px}
  .nextset .k{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--brand)}
  .nextset .big{font-size:22px;font-weight:800;margin-top:4px;font-family:var(--mono)}
  .nextset .sub{font-size:12px;color:var(--muted);margin-top:4px}

  /* body map */
  .bodywrap{display:flex;gap:8px;padding:16px 12px;justify-content:center}
  .bodyfig{display:flex;flex-direction:column;align-items:center;gap:4px}
  .bodyfig svg{width:118px;height:300px}
  .bodyfig .cap{font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--dim)}
  .mregion{cursor:pointer;transition:opacity .15s,stroke-width .15s;stroke:#0c0d0f;stroke-width:1}
  .mregion:hover,.mregion.on{stroke:#fff;stroke-width:2}
  .bodylegend{display:flex;flex-wrap:wrap;gap:8px 14px;padding:10px 16px;border-top:1px solid var(--border)}

<script>
/* ============================================================ DATA ============ */
function genSet(peak,n,shape){
  const a=[];
  for(let i=0;i<n;i++){
    const t=n>1?i/(n-1):0; let v;
    if(shape==='decay')      v=peak*(1-0.30*t);
    else if(shape==='slow')  v=peak*(1-0.32*t)+(i===0?-0.045:i===1?-0.02:i===2?-0.005:0); // slow-start rise then decay
    else if(shape==='gain')  v=peak*(0.84+0.17*t);
    else if(shape==='erratic')v=peak*(1-0.24*t)+((i%2)?0.028:-0.028);
    else v=peak*(1-0.26*t);
    v+=(((i*37)%7)-3)*0.004;
    a.push(Math.max(0.18,Math.round(v*100)/100));
  }
  return a;
}
const EX={
  'cable-row':{name:'Seated Cable Row',wt:145,e1rm:205,pr:true,tempo:{con:900,hold:300,ecc:1500},cat:'Back',

          {reps:8,rpe:8,peak:0.63,shape:'decay'},{reps:8,rpe:8.5,peak:0.60,shape:'decay',live:true},
          {reps:7,rpe:9.5,peak:0.57,shape:'erratic'}]},
  'lat-pull':{name:'Lat Pulldown',wt:130,e1rm:188,tempo:{con:850,hold:200,ecc:1400},cat:'Back',
    sets:[{reps:10,rpe:7,peak:0.78,shape:'decay'},{reps:10,rpe:8,peak:0.74,shape:'decay'},
          {reps:9,rpe:8.5,peak:0.70,shape:'gain'},{reps:8,rpe:9,peak:0.66,shape:'decay'}]},
  'cable-press':{name:'Cable Chest Press',wt:90,e1rm:150,tempo:{con:800,hold:200,ecc:1300},cat:'Chest',
    sets:[{reps:10,rpe:7,peak:0.70,shape:'decay'},{reps:9,rpe:8,peak:0.66,shape:'decay'},
          {reps:8,rpe:8.5,peak:0.62,shape:'erratic'},{reps:8,rpe:9,peak:0.58,shape:'gain'}]},
  'cable-fly':{name:'Cable Fly',wt:45,e1rm:78,tempo:{con:1100,hold:400,ecc:1600},cat:'Chest',
    sets:[{reps:12,rpe:6,peak:0.90,shape:'decay'},{reps:12,rpe:7,peak:0.86,shape:'decay'},{reps:11,rpe:8,peak:0.82,shape:'erratic'}]},
  'face-pull':{name:'Face Pull',wt:35,e1rm:60,tempo:{con:900,hold:500,ecc:1200},cat:'Rear Delt',
    sets:[{reps:15,rpe:6,peak:0.95,shape:'decay'},{reps:15,rpe:7,peak:0.90,shape:'decay'},{reps:14,rpe:8,peak:0.85,shape:'decay'}]},
};
const SESSION_ORDER=['cable-row','lat-pull','cable-press','cable-fly','face-pull'];
// materialize rep arrays
for(const id in EX){EX[id].sets.forEach(s=>{s.reps_v=genSet(s.peak,s.reps,s.shape);});}

const PROGRAM={name:'12-Week Hypertrophy',week:8,total:12,mesos:[
  {id:'m1',name:'Accumulation',range:'Wks 1–5',status:'done'},
  {id:'m2',name:'Intensification',range:'Wks 6–10',status:'current',cur:3,tot:5,weeks:[
    {id:'w6',lbl:'Week 1',status:'done'},{id:'w7',lbl:'Week 2',status:'done'},
    {id:'w8',lbl:'Week 3',status:'current',workouts:[

  {id:'m3',name:'Realization',range:'Wks 11–12',status:'future'}]};

const BODY={

/* ============================================================ HELPERS ========= */
const $=id=>document.getElementById(id);
function velColor(v){return v<0.5?'#ff4757':v<0.75?'#ffa502':v<1.0?'#ffd43b':'#2ed573';}
function mean(a){return a.reduce((s,x)=>s+x,0)/a.length;}
function runBest(a){let m=0;return a.map(v=>(m=Math.max(m,v)));}
function setLoss(a){const b=Math.max(...a);return Math.round((b-a[a.length-1])/b*100);}
function f2(v){return v.toFixed(2);}
function lossClass(l){return l>=25?'bad':l>=18?'warn':'ok';}
function predRpe(loss){return 6.5+loss/6;} // crude vel->rpe model for calibration gauge

/* ============================================================ STATE =========== */
let mode='live';
let sel={exercise:null,set:null,rep:null,analytics:false}; // review drill
let psel={meso:null,week:null,workout:null};                // program drill

const RAIL=[

  ['program','Program',`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>`],
  ['body','Body',`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="2.5"/><path d="M12 8v8M12 10l-5 2M12 10l5 2M12 16l-3 5M12 16l3 5"/></svg>`],
  ['idle','Idle',`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 14A8 8 0 019 4a8 8 0 1011 10z"/></svg>`],
];
const CHIPS=[['live','Live set'],['rest','Rest'],['drill','Drill in'],['exercise','Exercise'],
             ['program','Program'],['body','Body map'],['idle','Idle wall']];
let activeChip='live';

function goChip(key){
  stopLive(); stopRest(); activeChip=key;
  if(key==='live'){mode='live';}
  else if(key==='rest'){mode='rest';}
  else if(key==='drill'){mode='review';sel={exercise:'cable-row',set:2,rep:null,analytics:false};}
  else if(key==='exercise'){mode='review';sel={exercise:'cable-row',set:null,rep:null,analytics:true};}
  else if(key==='program'){mode='program';psel={meso:'m2',week:'w8',workout:null};}
  else if(key==='body'){mode='body';bsel={muscle:'lats'};}

  render();
}
function goRail(m){

  mode=m; activeChip=(m==='review')?'drill':m;
  if(m==='review'&&!sel.exercise)sel={exercise:'cable-row',set:2,rep:null,analytics:false};
  if(m==='program'&&!psel.meso)psel={meso:'m2',week:'w8',workout:null};

}

/* ============================================================ CHROME ========== */
function renderChrome(){
  $('chips').innerHTML=CHIPS.map(([k,l])=>`<div class="chip ${activeChip===k?'on':''}" onclick="goChip('${k}')">${l}</div>`).join('');

function renderCrumb(items,tag){
  $('crumb').innerHTML=items.map((it,i)=>{
    const cur=i===items.length-1;
    return (i?`<span class="sep">›</span>`:'')+`<span class="c ${cur?'cur':''}" ${it.act&&!cur?`onclick="${it.act}"`:''}>${it.label}</span>`;
  }).join('')+`<span class="tag">${tag||''}</span>`;

/* ============================================================ COLUMN ENGINE === */
function reconcile(specs){
  let cols=$('stagebody').querySelector('.cols');
  if(!cols){$('stagebody').innerHTML='<div class="cols"></div>';cols=$('stagebody').querySelector('.cols');}
  const have=new Map([...cols.children].map(c=>[c.dataset.key,c]));
  const keys=new Set(specs.map(s=>s.key));
  let li=0;
  [...cols.children].forEach(c=>{if(!keys.has(c.dataset.key)){c.style.transitionDelay=(li*45)+'ms';li++;c.classList.add('leaving');setTimeout(()=>c.remove(),420);}});
  specs.forEach(s=>{
    let el=have.get(s.key); const isNew=!el;
    if(!el){el=document.createElement('div');el.dataset.key=s.key;el.className='col spawning';cols.appendChild(el);}
    el.innerHTML=`<div class="colinner">${s.html}</div>`;
    el.classList.remove('spine','full','wide','focus');
    el.classList.add(s.cls); el.style.transitionDelay='';
    if(isNew){requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.remove('spawning')));}
    cols.appendChild(el);
  });
}
// assign width classes: focus=deepest, depth1=full(or wide), deeper=spine (unless pinned)
function classFor(i,n,col){
  if(i===n-1)return 'focus';
  const depth=(n-1)-i;
  if(depth>=2 && !col.pin)return 'spine';
  return col.wide?'wide':'full';
}
function spineHtml(level,selLabel,items,selId,act){
  return `<div class="spineinner" onclick="event.stopPropagation()">
    <div class="spinesel">${selLabel}</div>
    <div class="spinedots">${items.map(it=>`<div class="spinedot ${it.id===selId?'on':''}" title="${it.label}" onclick="${act}('${it.id}')"></div>`).join('')}</div>
    <div class="spinelabel">${level}</div>
    <div class="spinehint">tap ▸</div>
  </div>`;
}

/* ---- column content builders (return {full, spine-items, level}) ---- */
function exerciseListCol(){

function velBarsHtml(reps,best,clickable){
  const scale=Math.max(best*1.06,0.2);
  const rb=runBest(reps);
  const stop=best*0.8;
  const bars=reps.map((v,i)=>{
    const h=v/scale*100;
    return `<div class="vbar ${clickable&&sel.rep===i?'sel':''}" style="height:${h}%;background:${velColor(v)}" ${clickable?`onclick="selRep(${i})"`:''}>
      <span class="lab">${f2(v)}</span></div>`;
  }).join('');
  const qdots=reps.map((v,i)=>{
    const drop=(rb[i]-v)/rb[i];
    const c=drop<0.10?'#2ed573':drop<0.20?'#ffb020':'#ff4757';
    return `<div class="qdot" style="background:${c}" title="drop ${Math.round(drop*100)}%"></div>`;
  }).join('');
  const stopPct=100-stop/scale*100, bestPct=100-best/scale*100;
  return `<div class="vbars">
      <div class="refline" style="top:${bestPct}%;border-color:rgba(232,234,237,.45)"><span class="rl" style="color:var(--muted)">best ${f2(best)}</span></div>
      <div class="refline" style="top:${stopPct}%;border-color:rgba(255,71,87,.55)"><span class="rl" style="color:var(--v-red)">−20% stop</span></div>
      ${bars}</div>
    <div class="qlane">${qdots}</div>`;
}
function tempoHtml(t){

    <div class="tlabels"><div style="flex:${t.con}">${t.con}ms</div><div style="flex:${t.hold}">${t.hold}ms</div><div style="flex:${t.ecc}">${t.ecc}ms</div></div>`;
}
function rpeGaugeHtml(loss,actual){
  const p=predRpe(loss);const lo=p-0.6,hi=p+0.6;
  const pos=x=>((x-6)/4)*100;
  return `<div class="rpeg"><div class="rpetrack"></div>
    <div class="rpeband" style="left:${pos(lo)}%;width:${pos(hi)-pos(lo)}%"></div>

    <div class="rpescale"><span>6</span><span>7</span><span>8</span><span>9</span><span>10</span></div></div>`;
}
function setDetailCol(exId,si){

  return {level:'Set detail',title:`${e.name} · Set ${si+1}`,sub:`${s.reps} × ${e.wt} lb`,html,pin:false};
}
function repDetailCol(exId,si,ri){
  const e=EX[exId],s=e.sets[si],reps=s.reps_v,v=reps[ri];
  const rb=runBest(reps)[ri];const drop=Math.round((rb-v)/rb*100);

  const html=`<div class="repbig"><span class="v" style="color:${velColor(v)}">${f2(v)}</span><div class="u">m/s mean concentric · Rep ${ri+1} of ${reps.length}</div></div>
    <div class="repgrid">

        <div><div style="font-size:20px;font-weight:800;font-family:var(--mono)">${e.e1rm} <span style="font-size:12px;color:var(--v-green)">▲ +9</span></div>

      <div class="nexttarget">▶ Next target &nbsp;<b>3×8–9 @ 150 lb</b> &nbsp;·&nbsp; hold mean ≥ 0.58 m/s</div></div>
    <div class="panel"><div class="ptitle"><span class="t">Strength trend · e1RM (line)</span><span class="m">across sessions</span></div>
      <svg class="trend" viewBox="0 0 ${w} ${h}"><path d="${path}" fill="none" stroke="#FF7900" stroke-width="2"/>${dots}${xl}</svg></div>
    <div class="panel"><div class="ptitle"><span class="t">Load–velocity profile</span><span class="m">▲ shift +3% vs wk1</span></div>

  const e=EX['cable-row'];
  return `<div class="hero" id="hero">
    <div class="herohead"><div><div class="herocat" id="herocat">Productive · in the band</div><div class="heroname">${e.name}</div></div>
      <div class="herodetail">SET <b>4</b>/5 · <b>${e.wt}</b> lb<br>Pull A · Intensification wk3</div></div>
    <div class="heromid">
      <div class="heroleft">
        <div class="herolabel">Per-rep velocity · live peak bounce</div>
        <div class="herobars" id="herobars"></div>
      </div>
      <div class="heroright">
        <div class="heropeak"><div class="v" id="heropeak" style="color:#2ed573">—</div><div class="u">m/s peak</div></div>
        <div class="herostats"><div class="hs"><div class="k">Rep</div><div class="v" id="hsrep">0/8</div></div>
          <div class="hs"><div class="k">Mean</div><div class="v" id="hsmean">—</div></div>
          <div class="hs"><div class="k">Loss</div><div class="v" id="hsloss">0%</div></div></div>
        <div><div class="herolabel">Live tempo</div>${tempoHtml(e.tempo)}
          <div class="tempo" style="margin-top:6px;height:16px"><div class="tseg" id="tphase" style="flex:1;background:#20232a;color:var(--muted)">READY</div></div></div>
        <div><div class="herolabel">Fatigue · auto-regulation</div>
          <div class="fmeter"><div class="fneedle" id="fneedle" style="left:0%"></div></div>
          <div class="fscale"><span>fresh</span><span>VL10</span><span>VL20</span><span>VL30</span><span>stop</span></div></div>
        <div><div class="herolabel">Set progress</div><div class="setprog"><div class="s done"></div><div class="s done"></div><div class="s done"></div><div class="s cur"></div><div class="s"></div></div></div>
        <div class="herocue" id="herocue"></div>
      </div></div>
  </div>`;
}
function startLive(){
  $('stagebody').innerHTML=heroSkeleton();
  renderCrumb([{label:'Live set'}],'across-the-room · SSE 11Hz');
  LS={rep:0,reps:[],best:0,phaseT:0,cycle:['con','hold','ecc','commit','rest'],max:8};
  const e=EX['cable-row'];const durs={con:e.tempo.con,hold:e.tempo.hold,ecc:e.tempo.ecc,commit:80,rest:900};
  let phaseIdx=0,acc=0;
  stopLive();
  liveIV=setInterval(()=>{
    const ph=LS.cycle[phaseIdx];acc+=60;
    const tphase=$('tphase');
    if(tphase){const nm={con:'CONCENTRIC',hold:'HOLD',ecc:'ECCENTRIC',commit:'',rest:'— rest —'}[ph];
      const col={con:'#2ed573',hold:'#406D87',ecc:'#FF7900',commit:'#20232a',rest:'#20232a'}[ph];
      if(ph==='con'||ph==='hold'||ph==='ecc'){tphase.style.background=col;tphase.style.color='#0c0d0f';tphase.textContent=nm;}
      else{tphase.style.background='#20232a';tphase.style.color='var(--muted)';tphase.textContent=nm;}}
    if(ph==='commit'&&acc>=durs.commit){commitLiveRep();}
    if(acc>=durs[ph]){acc=0;phaseIdx++;if(phaseIdx>=LS.cycle.length){phaseIdx=0;if(LS.rep>=LS.max){toRest();}}}
  },60);
}
function commitLiveRep(){
  if(!LS)return;const i=LS.rep;if(i>=LS.max)return;
  let v=0.61-0.026*i;if(i===3)v+=0.05;if(i===5)v-=0.015;v+=(((i*29)%5)-2)*0.006;v=Math.round(v*100)/100;
  LS.reps.push(v);LS.rep++;LS.best=Math.max(LS.best,v);
  const scale=Math.max(LS.best*1.08,0.2);
  const bars=$('herobars');
  const bar=document.createElement('div');bar.className='herobar pop';
  bar.style.height=(v/scale*100)+'%';bar.style.background=velColor(v);
  bar.innerHTML=`<span class="lab">${f2(v)}</span>`;bars.appendChild(bar);
  // rescale existing
  [...bars.children].forEach((b,k)=>{if(LS.reps[k]!==undefined)b.style.height=(LS.reps[k]/scale*100)+'%';});
  const peak=(v*1.27);const pk=$('heropeak');pk.textContent=f2(peak);pk.style.color=velColor(v);
  pk.classList.remove('bounce');void pk.offsetWidth;pk.classList.add('bounce');
  const m=mean(LS.reps),loss=Math.round((LS.best-v)/LS.best*100);
  $('hsrep').textContent=LS.rep+'/'+LS.max;$('hsmean').textContent=f2(m);$('hsloss').textContent=loss+'%';
  $('fneedle').style.left=Math.min(98,loss/40*100)+'%';
  const hero=$('hero'),cat=$('herocat'),cue=$('herocue');
  hero.classList.remove('flood-amber','flood-red');cue.classList.remove('show','amber','red');
  if(loss>=28){hero.classList.add('flood-red');cat.textContent='Stop · past VL20';cue.classList.add('show','red');cue.innerHTML='■ Velocity loss '+loss+'% — end the set now.';}
  else if(loss>=20){hero.classList.add('flood-amber');cat.textContent='Threshold · VL20 reached';cue.classList.add('show','amber');cue.innerHTML='▲ VL20 · target reps met — final rep or end set.';}
  else{cat.textContent='Productive · in the band';}
}
function toRest(){stopLive();setTimeout(()=>{if(mode==='live'){activeChip='rest';mode='rest';renderChrome();startRest();}},700);}

/* ---- rest hero ---- */
function startRest(){
  const e=EX['cable-row'],s=e.sets[3],reps=s.reps_v,m=mean(reps),loss=setLoss(reps),best=Math.max(...reps);
  let t=90;
  const draw=()=>{
    const frac=t/90,circ=2*Math.PI*100;
    $('stagebody').innerHTML=`<div class="restwrap">
      <div class="restleft"><div class="herolabel">Rest · next set in</div>
        <div class="restring"><svg viewBox="0 0 220 220"><circle cx="110" cy="110" r="100" fill="none" stroke="#20232a" stroke-width="10"/>
          <circle cx="110" cy="110" r="100" fill="none" stroke="#FF7900" stroke-width="10" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ*(1-frac)}" transform="rotate(-90 110 110)"/></svg>
          <div class="num"><div class="t">${t}</div><div class="k">seconds</div></div></div>
        <div style="font-size:12px;color:var(--muted)">Set 4 of 5 complete · 1 set remaining</div></div>
      <div class="restright">
        <div class="verdict"><div class="cat">Set 4 verdict · rep-quality</div>
          <div class="line">Solid work set — held above the VL20 line to the last rep.</div>
          <div class="sub">Bar speed decayed smoothly · RPE ${s.rpe} matched predicted ${predRpe(loss).toFixed(1)}.</div>
          <div class="summrow">
            <div class="summcell"><div class="k">Reps</div><div class="v">${reps.length}</div></div>
            <div class="summcell"><div class="k">Mean</div><div class="v" style="color:${velColor(m)}">${f2(m)}</div></div>
            <div class="summcell"><div class="k">Loss</div><div class="v ${lossClass(loss)}">−${loss}%</div></div>
            <div class="summcell"><div class="k">Best</div><div class="v">${f2(best)}</div></div>
            <div class="summcell"><div class="k">e1RM</div><div class="v" style="color:var(--brand)">${e.e1rm}</div></div></div></div>
        <div class="nextset"><div class="k">▶ Next set · 5 of 5</div>
          <div class="big">8 × ${e.wt} lb</div>
          <div class="sub">hold mean ≥ 0.55 m/s · last set — push to a true RPE 9.5 · rest shown only now, between sets</div></div>
      </div></div>`;
  };
  draw();renderCrumb([{label:'Rest phase'}],'rest-only next-set info');
  stopRest();restIV=setInterval(()=>{t--;if(t<=0){t=90;}draw();},1000);
}

/* ============================================================ RENDER ========== */
function render(){
  renderChrome();
  stopLive();stopRest();
  // clear cols container when leaving column modes
  const colMode=(mode==='review'||mode==='program'||mode==='body');
  if(!colMode){$('stagebody').querySelectorAll('.cols').forEach(c=>c.remove());}
  if(mode==='live')startLive();
  else if(mode==='rest')startRest();
  else if(mode==='review')renderReview();
  else if(mode==='program')renderProgram();
  else if(mode==='body')renderBody();
  else if(mode==='idle')renderIdle();
}
render();
</script>
</body>
</html>
