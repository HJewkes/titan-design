name: Publish review-schema

# Publishes @titan-design/review-schema only. publish.yml's `v*` filter never matches a
# `review-schema-v*` tag (a filter matches the whole tag name), and this filter never matches `v*`.
on:
  push:
    tags:
      - 'review-schema-v*'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @titan-design/review-schema lint
      - run: pnpm --filter @titan-design/review-schema type-check
      - run: pnpm --filter @titan-design/review-schema build
      - run: pnpm --filter @titan-design/review-schema test:unit:ci

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Verify version
        run: |
          case "$GITHUB_REF_NAME" in
            review-schema-v*) ;;
            *)
              echo "Ref $GITHUB_REF_NAME is not a review-schema-v* tag"
              exit 1
              ;;
          esac
          TAG_VERSION="${GITHUB_REF_NAME#review-schema-v}"
          PKG_VERSION=$(node -p "require('./packages/review-schema/package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) doesn't match packages/review-schema/package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "Version verified: $PKG_VERSION"

      - run: pnpm --filter @titan-design/review-schema build

      - name: Publish to npm
        run: npx npm@latest publish --provenance --access public
        working-directory: packages/review-schema
