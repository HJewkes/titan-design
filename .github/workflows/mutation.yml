name: Mutation

# Advisory Stryker run over the jsdom logic in packages/ui. It is not in ci.yml's
# `check.needs`, so a low score never blocks a merge. The pull_request trigger fires only
# when this workflow or its configs change, so a config edit proves itself on its own PR.
on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/mutation.yml
      - packages/ui/stryker.config.mjs
      - packages/ui/vitest.stryker.config.ts

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stryker:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # Stryker 10 requires Node 22.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fails on an empty report (no mutants, or none in carouselMath), never on a low score.
      - name: Stryker
        run: pnpm --filter @titan-design/react-ui test:mutation

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: packages/ui/reports/mutation/
          if-no-files-found: warn
          retention-days: 30
