name: CI

on:
  push:
    branches: [main]
  # Unfiltered so `check` reports on every PR, whatever it targets; a filtered-out required check blocks the merge.
  pull_request:

permissions:
  contents: read

# Rename stage (a) of the HJewkes/ci standard: the ruleset still requires build (20) and
# build (22), so the matrix keeps its name until the ruleset requires only `check`.
# A later PR replaces it with node.yml.
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # verify is format, lint, type-check, build, tests with coverage, then arch-graph
      # freshness (arch:check): the same gate as a local run.
      - name: Verify
        run: pnpm verify

  # The aggregator the ruleset will require; all-green also fails if a job here is missing from needs.
  check:
    if: always()
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: HJewkes/ci/actions/all-green@v1
        with:
          needs: ${{ toJSON(needs) }}
