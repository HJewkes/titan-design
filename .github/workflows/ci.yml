name: CI

on:
  push:
    branches: [main]
  # Unfiltered so `check` reports on every PR, whatever it targets; a filtered-out required check blocks the merge.
  pull_request:

permissions:
  contents: read

# Rename stage (a) of the HJewkes/ci standard: the required checks are `build (22)` and `check`,
# so the single-entry matrix keeps the job named `build (22)` until the ruleset requires only `check`.
# A later PR replaces it with node.yml.
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    # In turbo.json globalEnv, so a Node version bump never replays another version's turbo cache.
    env:
      NODE_VERSION: ${{ matrix.node-version }}

    steps:
      # Full history so the release-bump step can read the PR base's API reports.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # TD-733: a PR replays main's newest turbo entry, so a package it leaves untouched skips lint,
      # type-check and test:unit. Only a push to main saves: a PR's cache scope is unreadable from main.
      # Main never restores, so every merged tree runs in full and each saved entry holds one run.
      - name: Restore turbo cache
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-node${{ matrix.node-version }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-node${{ matrix.node-version }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # verify:unit is format, lint, type-check, build, tests with coverage, then arch-graph
      # freshness (arch:check): local `pnpm verify` minus stories-axe, which runs in its own job.
      - name: Verify
        run: pnpm verify:unit

      # A PR that changes packages/ui's version must bump at least as far as its API report diff
      # requires; the script skips when the version matches the base.
      - name: Release bump
        if: github.event_name == 'pull_request'
        run: node packages/ui/scripts/check-release-bump.mjs --base "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

      # publint --strict plus attw on the packed tarball, so an export-map regression fails before a tag exists.
      - name: Package shape
        run: pnpm check:package

      # Brotli size of each ESM entry plus tokens.css against packages/ui/.size-limit.json; reads the dist/ Verify built.
      - name: Bundle budget
        run: pnpm --filter @titan-design/react-ui size

      - name: Import cycles
        run: pnpm --filter @titan-design/react-ui check:cycles

      - name: Save turbo cache
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-node${{ matrix.node-version }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

  # Job id stays `visual`: the ruleset requires a status of exactly that name.
  visual:
    runs-on: ubuntu-latest
    # Pinned to the Playwright version in packages/ui (@playwright/test 1.58.2)
    # so the browser + font rendering matches the committed *-chromium-linux.png
    # Layer-1 baselines byte-for-byte. Browsers ship preinstalled in this image.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    # pull-requests: read lets the path classifier list the PR's files.
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v4

      # TD-645: a PR that changes no rendered UI skips every later step and ends green, since a
      # workflow `paths` filter would leave this required check pending. The PR files API is one
      # request per 100 files and needs neither git history nor gh in the container; on any API
      # error the script runs everything. A push to main always runs everything. The rendered-UI
      # set lives in packages/ui/scripts/visual-paths.mjs.
      - name: Rendered UI changed?
        id: paths
        if: github.event_name == 'pull_request'
        run: node packages/ui/scripts/visual-paths.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - uses: pnpm/action-setup@v4
        if: steps.paths.outputs.run != 'false'

      - uses: actions/setup-node@v4
        if: steps.paths.outputs.run != 'false'
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.paths.outputs.run != 'false'

      # Layer 3 — HTML-vs-React parity (computed-style compare). Boots the
      # specimen dev server; a computed-style mismatch fails the run.
      - name: Layer 3 — HTML vs React parity
        if: steps.paths.outputs.run != 'false'
        run: pnpm --filter @titan-design/react-ui test:visual:compare

      # A single-file consumer of global.css, opened over file:// with the network
      # blocked, must still load every titan font face (TD-36).
      - name: Offline fonts — single-file consumer
        if: steps.paths.outputs.run != 'false'
        run: pnpm --filter @titan-design/react-ui test:offline-fonts

      # Layer 1 — component screenshot baselines. Any pixel diff against the
      # committed baselines exits non-zero and fails the build.
      - name: Layer 1 — component screenshot baselines
        if: steps.paths.outputs.run != 'false'
        run: pnpm --filter @titan-design/react-ui test:visual:baseline

      # Layer 1 — REGEN (refresh): regenerate the Layer-1 baselines IN this pinned
      # container and upload them, so a drifted baseline can be refreshed byte-exact.
      # Runs only when an earlier step failed (`if: failure()`), so a green run
      # renders once. Because it renders in the same container as the gate,
      # UNCHANGED baselines come back byte-identical (git shows no diff) and only genuinely-changed components differ — no local
      # env noise. To refresh: download the `component-visual-baselines` artifact and
      # commit the changed *-chromium-linux.png under packages/ui/specimen/baseline/.
      - name: Layer 1 — regenerate baselines (refresh)
        if: failure() && steps.paths.outputs.run != 'false'
        run: pnpm --filter @titan-design/react-ui test:visual:baseline:update
      - name: Upload regenerated component baselines
        if: failure() && steps.paths.outputs.run != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: component-visual-baselines
          path: packages/ui/specimen/baseline/**/*-chromium-linux.png
          retention-days: 7

      # Layer 2 — Storybook story baselines (shell + icons + chat; clock-frozen so
      # live/animated stories are deterministic). One test per story on 4 workers
      # (playwright.config.ts). Any pixel drift or blank render against the
      # committed *-chromium-linux.png under
      # packages/ui/tests/visual/reference/stories.spec.ts-snapshots/ fails the build.
      - name: Layer 2 — Storybook story baselines
        if: steps.paths.outputs.run != 'false'
        run: pnpm --filter @titan-design/react-ui test:visual:stories

      # The regen step below runs the same suite again and Playwright empties its outputDir on
      # start, so the failing run's screenshots, error-context and traces must be saved first (TD-636).
      - name: Upload Layer 2 failure results
        if: failure() && steps.paths.outputs.run != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: layer2-failure-results
          path: |
            packages/ui/tests/visual/results/**/test-failed-*.png
            packages/ui/tests/visual/results/**/error-context.md
            packages/ui/tests/visual/results/**/trace.zip
          if-no-files-found: warn
          retention-days: 7

      # Layer 2 — REGEN (refresh): same pattern as Layer 1. Runs only on a failed
      # run, renders in the same container, so unchanged stories come
      # back byte-identical and only real drift (or a newly in-scope story with
      # no baseline yet) shows up in git. To refresh: download the
      # `storybook-visual-baselines` artifact and commit the changed PNGs.
      - name: Layer 2 — regenerate story baselines (refresh)
        if: failure() && steps.paths.outputs.run != 'false'
        run: pnpm --filter @titan-design/react-ui test:visual:stories:update
      - name: Upload regenerated Storybook baselines
        if: failure() && steps.paths.outputs.run != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: storybook-visual-baselines
          path: packages/ui/tests/visual/reference/stories.spec.ts-snapshots/
          retention-days: 7

      # Interaction — carousel behaviour and keyboard tests, the `interaction`
      # project of playwright.config.ts. They assert on the DOM and never
      # screenshot.
      - name: Interaction — carousel behaviour
        if: steps.paths.outputs.run != 'false'
        run: pnpm --filter @titan-design/react-ui exec playwright test --project=interaction

      # No html reporter is configured, so the diagnostics are the per-test
      # -actual/-diff/-expected PNGs: Layer 2 writes to tests/visual/results
      # (playwright.config.ts outputDir), Layers 1 and 3 to Playwright's default
      # test-results, the interaction project to /tmp (it must stay outside
      # Storybook's watched root, or Vite reloads the page mid-test). Uploading a
      # directory that never exists made every failed gate undiagnosable from CI
      # (titan PR #245 was the first casualty).
      - name: Upload Playwright failure diagnostics
        if: failure() && steps.paths.outputs.run != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-diagnostics
          path: |
            packages/ui/tests/visual/results/
            /tmp/titan-ui-playwright-interaction/
            packages/ui/test-results/
          if-no-files-found: warn
          retention-days: 7

  # Runs the Storybook play functions in the `storybook` vitest browser project; the image
  # ships Chromium, and addon-vitest compiles stories itself, so nothing builds or serves Storybook.
  storybook-play:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Storybook play functions
        run: pnpm test:storybook

  # Axe on every story under jsdom, parallel to build.
  stories-axe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Stories axe
        run: pnpm test:axe

  # pnpm audit reads the lockfile only, so the job needs no install.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: scripts/audit-retry.sh

  # The aggregator the ruleset will require; all-green also fails if a job here is missing from needs.
  check:
    if: always()
    needs: [build, stories-axe, visual, storybook-play, audit]
    runs-on: ubuntu-latest
    steps:
      - uses: HJewkes/ci/actions/all-green@v1
        with:
          needs: ${{ toJSON(needs) }}
