name: Visual Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  visual:
    runs-on: ubuntu-latest
    # Pinned to the Playwright version in packages/ui (@playwright/test 1.58.2)
    # so the browser + font rendering matches the committed *-chromium-linux.png
    # Layer-1 baselines byte-for-byte. Browsers ship preinstalled in this image.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Layer 3 — HTML-vs-React parity (computed-style compare). Boots the
      # specimen dev server; a computed-style mismatch fails the run.
      - name: Layer 3 — HTML vs React parity
        run: pnpm --filter @titan-design/react-ui test:visual:compare

      # Layer 1 — component screenshot baselines. Any pixel diff against the
      # committed baselines exits non-zero and fails the build.
      - name: Layer 1 — component screenshot baselines
        run: pnpm --filter @titan-design/react-ui test:visual:baseline

      # Layer 2 — Storybook story baselines (shell + icons; clock-frozen so
      # live/animated stories are deterministic).
      #
      # BOOTSTRAP: baselines aren't committed yet (they must be generated in
      # THIS pinned container to match byte-for-byte). This step generates them
      # and uploads them as the `storybook-visual-baselines` artifact. To turn on
      # the gate: download the artifact, commit its *-chromium-linux.png under
      # packages/ui/tests/visual/reference/stories.spec.ts-snapshots/, then change
      # `test:visual:stories:update` below to the gate `test:visual:stories`.
      - name: Layer 2 — Storybook story baselines (seed)
        run: pnpm --filter @titan-design/react-ui test:visual:stories:update
      - name: Upload seeded Storybook baselines
        uses: actions/upload-artifact@v4
        with:
          name: storybook-visual-baselines
          path: packages/ui/tests/visual/reference/stories.spec.ts-snapshots/
          retention-days: 7

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/ui/playwright-report/
          retention-days: 7
