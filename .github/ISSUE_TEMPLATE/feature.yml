name: Feature
description: New component or capability
labels: ["type:feature"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What should be built and why?
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: Checklist of conditions that must be true when this is done.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: affected-files
    attributes:
      label: Affected Files
      description: Key files to create or modify (if known).
    validations:
      required: false
  - type: textarea
    id: design-notes
    attributes:
      label: Design Notes
      description: API surface, variant options, compound component structure, or other design decisions.
    validations:
      required: false
